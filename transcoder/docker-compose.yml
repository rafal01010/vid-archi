services:
  transcoder-360p:
    image: ${TRANSCODER_IMAGE:-vid-archi-transcoder:stg}
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV}
      AWS_REGION: ${AWS_REGION}
      DATABASE_URL: ${STG_DATABASE_URL}
      STG_DATABASE_URL: ${STG_DATABASE_URL}
      VIDEO_POLICY_FILE: /app/config/video_policy.json
      UPLOAD_BUCKET: ${UPLOAD_BUCKET}
      PROCESSED_BUCKET: ${PROCESSED_BUCKET}
      LOCAL_UPLOAD_BUCKET: ${LOCAL_UPLOAD_BUCKET:-}
      LOCAL_PROCESSED_BUCKET: ${LOCAL_PROCESSED_BUCKET:-}
      LOCAL_S3_ENDPOINT: ${LOCAL_S3_ENDPOINT:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      TRANSCODER_RENDITION: 360p
      TRANSCODER_POLL_INTERVAL_SECONDS: ${TRANSCODER_POLL_INTERVAL_SECONDS:-5}
      TRANSCODER_TEMP_DIR: /tmp/vid-archi-transcoder
    tmpfs:
      - /tmp

